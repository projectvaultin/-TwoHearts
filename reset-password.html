<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — TwoHearts</title>
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<main class="auth">
  <div class="auth-card">
    <a class="brand" href="/">♡ TwoHearts</a>
    <h1 style="margin:20px 0 8px">Set new password</h1>
    <p>Choose a strong password for your account.</p>
    <div id="expiredMsg" style="display:none;background:rgba(239,68,68,.1);border:1px solid var(--danger);
      border-radius:12px;padding:14px;margin:16px 0;color:var(--danger)">
      ⚠️ This reset link has expired. <a href="login.html">Request a new one</a>
    </div>
    <form id="resetForm" style="margin-top:20px">
      <label>New password
        <input id="password" type="password" required minlength="8" placeholder="Min 8 characters" autocomplete="new-password">
      </label>
      <label>Confirm password
        <input id="confirm" type="password" required minlength="8" placeholder="Repeat password" autocomplete="new-password">
      </label>
      <div id="strength" style="height:6px;border-radius:99px;background:var(--border);margin:8px 0;overflow:hidden">
        <div id="strengthBar" style="height:100%;width:0%;border-radius:99px;transition:all .3s"></div>
      </div>
      <p id="strengthLabel" class="status" style="font-size:12px;margin-bottom:12px"></p>
      <button type="submit" class="button accent full">Set new password</button>
      <p id="status" class="status mt center"></p>
    </form>
  </div>
</main>
<script type="module">
import { supabase } from '/src/lib/supabase.js';
import { toast } from '/src/lib/ui.js';

// Check for valid session from email link
const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  document.querySelector('#resetForm').style.display = 'none';
  document.querySelector('#expiredMsg').style.display = 'block';
}

// Password strength indicator
const pwInput = document.querySelector('#password');
const bar     = document.querySelector('#strengthBar');
const lbl     = document.querySelector('#strengthLabel');

pwInput.addEventListener('input', () => {
  const v = pwInput.value;
  let score = 0;
  if (v.length >= 8)  score++;
  if (v.length >= 12) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['','#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
  const labels = ['','Weak','Fair','Good','Strong','Very strong'];
  bar.style.width  = (score * 20) + '%';
  bar.style.background = colors[score] || 'var(--border)';
  lbl.textContent  = score > 0 ? labels[score] : '';
});

document.querySelector('#resetForm').onsubmit = async e => {
  e.preventDefault();
  const pw  = document.querySelector('#password').value;
  const con = document.querySelector('#confirm').value;
  const st  = document.querySelector('#status');

  if (pw !== con) { st.textContent = 'Passwords do not match.'; return; }
  if (pw.length < 8) { st.textContent = 'Password must be at least 8 characters.'; return; }

  st.textContent = 'Updating…';
  const { error } = await supabase.auth.updateUser({ password: pw });
  if (error) { st.textContent = error.message; return; }

  toast('Password updated! Signing you in…', 'success');
  setTimeout(() => location.href = '/app.html', 1500);
};
</script>
</body>
</html>
