<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Important Dates — TwoHearts</title>
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<nav class="nav">
  <a href="/app.html" class="icon-btn">←</a>
  <span style="font-weight:800">🗓️ Important Dates</span>
  <div></div>
</nav>
<main class="page">
  <div class="section">
    <p class="eyebrow">NEVER FORGET</p>
    <h1>Important Dates</h1>
    <p>Add dates that matter — we'll remind you before they arrive.</p>
  </div>

  <!-- Upcoming countdowns -->
  <div id="upcomingList" class="section"></div>

  <!-- Add date form -->
  <div class="panel section">
    <h2 class="mb">Add a date</h2>
    <form id="dateForm">
      <label>What is it?
        <input id="dateTitle" placeholder="e.g. Our anniversary, Her birthday" required maxlength="100">
      </label>
      <label>Date
        <input id="dateValue" type="date" required>
      </label>
      <label>Repeat every year?
        <select id="dateRecurring">
          <option value="yearly">Yes — remind me every year</option>
          <option value="once">No — one time only</option>
        </select>
      </label>
      <label>Reminder (days before)
        <select id="dateReminder">
          <option value="1">1 day before</option>
          <option value="3">3 days before</option>
          <option value="7" selected>1 week before</option>
          <option value="14">2 weeks before</option>
          <option value="30">1 month before</option>
        </select>
      </label>
      <button type="submit" class="button accent full mt">Save date</button>
      <p id="dateStatus" class="status mt"></p>
    </form>
  </div>

  <!-- All dates list -->
  <div class="panel section">
    <h2 class="mb">All saved dates</h2>
    <div id="dateList"><p class="status">Loading…</p></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="/app.html"><span class="icon">🏠</span>Home</a>
  <a href="/chat.html"><span class="icon">💬</span>Chat</a>
  <a href="/connect.html"><span class="icon">🔍</span>Connect</a>
  <a href="/memories.html"><span class="icon">📸</span>Memories</a>
  <a href="/settings.html"><span class="icon">⚙️</span>Settings</a>
</nav>
<script type="module" src="/src/pages/important-dates.js"></script>
</body>
</html>
