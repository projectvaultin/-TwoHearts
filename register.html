<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — TwoHearts</title><link rel="stylesheet" href="/src/styles/app.css"></head><body><main class="auth"><form id="registerForm" class="panel"><a class="brand" href="/">♡ TwoHearts</a><h1>Create account</h1><label>Display name<input id="displayName" maxlength="60" required></label><label>Username<input id="username" maxlength="30" pattern="[A-Za-z0-9_]+" required></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="button dark full">Create account</button><p id="status" class="status"></p><p class="center">Already registered? <a href="/login.html">Sign in</a></p></form></main><script type="module" src="/src/pages/auth/register.js"></script></body></html>
